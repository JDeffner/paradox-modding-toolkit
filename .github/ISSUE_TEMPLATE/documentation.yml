name: Documentation
description: Something in the wiki or README is wrong, missing, or confusing
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Page or section (optional)
      description: Link to the page or name the section. Leave blank for new content.
      placeholder: e.g. wiki "Getting started", or README "Data sources"

  - type: textarea
    id: details
    attributes:
      label: Correction or missing content
      description: Explain what needs to change, or paste the text you want added. You can include sources and screenshots here.
    validations:
      required: true
