name: Schema gap
description: A game folder maps to the wrong definition kind, or is not recognised at all
labels: ["schema"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Crusader Kings III (ck3)
        - Victoria 3 (vic3)
        - Europa Universalis V (eu5)
    validations:
      required: true

  - type: input
    id: folder
    attributes:
      label: Folder path
      description: Path from the mod root. Include the load-stage folder for EU5.
      placeholder: e.g. in_game/common/great_projects
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What goes wrong today
      options:
        - Folder is not recognised at all (nothing indexed)
        - Folder maps to the wrong kind
        - Definition names come out wrong
        - Wrong or missing required localization keys
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: snippet
    attributes:
      label: Example file
      description: Paste or attach the smallest real example that shows the problem. Include its source filename.
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Game version (optional)

  - type: textarea
    id: extra
    attributes:
      label: Sources or other context (optional)
      description: Links to game documentation, relevant localization keys, or an overlay you already use.
