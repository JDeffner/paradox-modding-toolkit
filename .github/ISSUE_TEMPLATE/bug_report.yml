name: Bug report
description: Something misbehaves in the editor
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the steps that caused the problem, what happened, and what you expected.
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Crusader Kings III (ck3)
        - Victoria 3 (vic3)
        - Europa Universalis V (eu5)
        - Not game-specific / not sure
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions (optional)
      description: "If known: toolkit version, editor, game version, and tiger version when relevant."

  - type: textarea
    id: extra
    attributes:
      label: Files, screenshots or logs (optional)
      description: Paste or attach a small example, error message, or relevant output that helps reproduce the problem.
