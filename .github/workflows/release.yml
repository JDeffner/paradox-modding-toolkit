# Release pipeline. Two entry points:
#
#  - Push a tag `v*` (e.g. v0.1.0): builds, tests, packages the vsix and
#    attaches it to a GitHub Release. No Marketplace interaction.
#  - Run the workflow manually with "publish" checked: additionally publishes
#    the vsix to the VS Code Marketplace. Needs the VSCE_PAT repo secret
#    (Azure DevOps PAT with Marketplace > Manage scope) — see AGENTS.md
#    "Releasing".
#
# The "prerelease" input controls the Marketplace pre-release flag. It is OFF by
# default: the beta ships on the normal channel, because the pre-release channel
# makes users opt in inside VS Code and is not worth the friction. "Beta" is said
# in the README and the changelog instead. The flag also has to be set at PACKAGE
# time, not just at publish time: `vsce package --pre-release` writes
# Microsoft.VisualStudio.Code.PreRelease into the vsix manifest, and publishing
# that file puts it on the pre-release channel whatever the publish flags say.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the VS Code Marketplace"
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release (users must opt in; off by default)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Must match ci.yml: jsdom declares node ^22.22.2 || ^24.15.0 || >=26,
          # and the jsdom suites fail at import on 20. This is the build/test
          # runtime only; the shipped bundles still target node18.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Same gate as CI: a tag build must not ship a boundary violation.
      - name: Game boundary (no game strings outside games/ and vscode/)
        run: node scripts/check-game-boundary.mjs

      # Compile BEFORE the tests: the LSP/stdio/vic3 smoke tests fork
      # dist/server.js and silently skip when it does not exist.
      - run: pnpm run compile

      # Corpus-gated tests skip automatically (no game files in CI).
      - run: pnpm test

      # Everything in the package's dist/ ships in the vsix; stray bundles must not.
      - run: rm -f packages/vscode/dist/*.cjs

      - name: Package vsix
        working-directory: packages/vscode
        # --baseImagesUrl is not optional in a monorepo: vsce resolves relative
        # image links against the repo root, so the banner and the screenshots
        # would 404 on the listing without the packages/vscode prefix.
        run: |
          FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAG="--pre-release"; fi
          npx vsce package $FLAG --no-dependencies \
            --baseImagesUrl https://github.com/JDeffner/paradox-modding-toolkit/raw/main/packages/vscode

      - name: Build server tarball (standalone --stdio server for other editors)
        run: node scripts/build-server-tarball.mjs

      # Self-contained Windows artifact: the same payload plus the pinned,
      # checksum-verified official node.exe and px-lsp.cmd, so an embedder
      # needs no Node on the target machine. No --local-node here: a release
      # must carry the official binary.
      - name: Build Windows server zip (bundled node.exe)
        run: node scripts/build-server-zip.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: |
            packages/vscode/*.vsix
            px-lsp-server-*.tar.gz
            px-lsp-win-x64-*.zip

      - name: GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/vscode/*.vsix
            px-lsp-server-*.tar.gz
            px-lsp-win-x64-*.zip
          prerelease: true
          generate_release_notes: true

      # Announce the release in the Discord server's #toolkit-updates, pinging
      # the @Paradox Toolkit role. DISCORD_RELEASE_WEBHOOK is a plain Discord
      # webhook URL (repo secret). Missing secret = silent skip; a failed post
      # warns but never fails a release that already shipped.
      - name: Announce on Discord (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          jq -n --arg tag "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" \
            '{content: "<@&1534329963933864079> **Paradox Toolkit \($tag)** is out.\nhttps://github.com/\($repo)/releases/tag/\($tag)",
              allowed_mentions: {roles: ["1534329963933864079"]}}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK" \
            || echo "::warning::Discord release announcement failed"

      - name: Publish to Marketplace
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAG="--pre-release"; fi
          npx vsce publish $FLAG --no-dependencies --packagePath *.vsix
