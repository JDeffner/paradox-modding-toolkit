# Release pipeline. Two entry points:
#
#  - Push a tag `v*` (e.g. v0.1.0): builds, tests, packages the vsix and
#    attaches it to a GitHub Release. No Marketplace interaction.
#  - Run the workflow manually with "publish" checked: additionally publishes
#    the vsix to the VS Code Marketplace. Needs the VSCE_PAT repo secret
#    (Azure DevOps PAT with Marketplace > Manage scope) — see AGENTS.md
#    "Releasing".
#
# The "prerelease" input controls the Marketplace pre-release flag. It is OFF by
# default: the beta ships on the normal channel, because the pre-release channel
# makes users opt in inside VS Code and is not worth the friction. "Beta" is said
# in the README and the changelog instead. The flag also has to be set at PACKAGE
# time, not just at publish time: `vsce package --pre-release` writes
# Microsoft.VisualStudio.Code.PreRelease into the vsix manifest, and publishing
# that file puts it on the pre-release channel whatever the publish flags say.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the VS Code Marketplace"
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release (users must opt in; off by default)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Must match ci.yml: jsdom declares node ^22.22.2 || ^24.15.0 || >=26,
          # and the jsdom suites fail at import on 20. This is the build/test
          # runtime only; the shipped bundles still target node18.
          node-version: 22
          cache: pnpm
          # Writes the ~/.npmrc that reads NODE_AUTH_TOKEN, for the npm
          # publish step below. Harmless for builds that never publish.
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Same gate as CI: a tag build must not ship a boundary violation.
      - name: Game boundary (no game strings outside games/ and vscode/)
        run: node scripts/check-game-boundary.mjs

      # Compile BEFORE the tests: the LSP/stdio/vic3 smoke tests fork
      # dist/server.js and silently skip when it does not exist.
      - run: pnpm run compile

      # Corpus-gated tests skip automatically (no game files in CI).
      - run: pnpm test

      # Everything in the package's dist/ ships in the vsix; stray bundles must not.
      - run: rm -f packages/vscode/dist/*.cjs

      - name: Package vsix
        working-directory: packages/vscode
        # --baseImagesUrl is not optional in a monorepo: vsce resolves relative
        # image links against the repo root, so the banner and the screenshots
        # would 404 on the listing without the packages/vscode prefix.
        run: |
          FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAG="--pre-release"; fi
          npx vsce package $FLAG --no-dependencies \
            --baseImagesUrl https://github.com/JDeffner/paradox-modding-toolkit/raw/main/packages/vscode

      - name: Build server tarball (standalone --stdio server for other editors)
        run: node scripts/build-server-tarball.mjs

      # Self-contained Windows artifact: the same payload plus the pinned,
      # checksum-verified official node.exe and px-lsp.cmd, so an embedder
      # needs no Node on the target machine. No --local-node here: a release
      # must carry the official binary.
      - name: Build Windows server zip (bundled node.exe)
        run: node scripts/build-server-zip.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: |
            packages/vscode/*.vsix
            px-lsp-server-*.tar.gz
            px-lsp-win-x64-*.zip

      # The human-written notes (docs/release/<version>.md) are the
      # release body AND the Discord post. The H1 and the trailing "Full
      # changelog" pointer are dropped: the release page shows the version
      # already, and the Discord post appends its own changelog link. A tag
      # with no notes file falls back to GitHub's generated commit list.
      - name: Collect release notes (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          FILE="docs/release/${GITHUB_REF_NAME#v}.md"
          if [ -f "$FILE" ]; then
            sed -e '1{/^# /d}' -e '/^### Full changelog/,$d' "$FILE" | sed -e '/./,$!d' > release-body.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$FILE missing, release body falls back to generated notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            packages/vscode/*.vsix
            px-lsp-server-*.tar.gz
            px-lsp-win-x64-*.zip
          prerelease: true
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release-body.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}

      # Announce the release in the Discord server's #toolkit-updates, pinging
      # the @Paradox Toolkit role. DISCORD_RELEASE_WEBHOOK is a plain Discord
      # webhook URL (repo secret). The whole post is a plain message, no embed:
      # `content` caps at 2000 chars, so the notes are cut at 1600 on a line
      # boundary. Both URLs are wrapped in <> so Discord does not attach its
      # own link-preview embed to a post that is meant to be embed-free.
      # Missing secret = silent skip; a failed post warns but never fails a
      # release that already shipped.
      - name: Announce on Discord (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          if [ "$NOTES_FOUND" = "true" ]; then
            # head -c cuts BYTES: a multibyte character split at the boundary
            # would reach jq as invalid UTF-8 and kill the post. iconv -c drops
            # the incomplete sequence (the line-boundary cut below usually
            # removes it anyway; this covers the cut landing on a newline).
            NOTES=$(head -c 1600 release-body.md | iconv -c -f UTF-8 -t UTF-8)
            if [ "$(wc -c < release-body.md)" -gt 1600 ]; then
              NOTES=$(printf '%s' "$NOTES" | sed '$d')
              NOTES="$NOTES"$'\n'"…"
            fi
          else
            NOTES="See the release page for the changes."
          fi
          jq -n --arg tag "$GITHUB_REF_NAME" --arg url "$URL" --arg notes "$NOTES" \
            '{content: "<@&1534329963933864079> **Paradox Toolkit \($tag)** is out.\n\n\($notes)\n\nRelease: <\($url)>\nFull changelog: <https://github.com/JDeffner/paradox-modding-toolkit/blob/main/packages/vscode/CHANGELOG.md>",
              allowed_mentions: {roles: ["1534329963933864079"]}}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK" \
            || echo "::warning::Discord release announcement failed"

      - name: Publish to Marketplace
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAG="--pre-release"; fi
          npx vsce publish $FLAG --no-dependencies --packagePath *.vsix

      # npm publish for the LSP packages, version-guarded so a tag build is
      # enough: @px-lsp/protocol and @px-lsp/server version independently of
      # the extension and only bump when they changed, so "this exact version
      # is not on npm yet" IS the publish signal. Protocol goes first because
      # the server depends on it (pnpm rewrites the workspace:* range to the
      # real version on pack). Needs the NPM_TOKEN repo secret (granular npm
      # automation token with publish rights on the px-lsp scope); a missing
      # secret warns and skips instead of failing a release that already
      # shipped its GitHub artifacts.
      - name: Publish npm packages (only versions not on npm yet)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret missing, npm publish skipped"
            exit 0
          fi
          for dir in packages/protocol packages/server; do
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            # "Not published" must come from the registry saying 404, not from
            # a failed lookup: a transient registry error must stop the step,
            # not funnel into a doomed publish. `npm view` of a missing
            # version can also exit 0 with empty output on some npm majors,
            # so the exit code AND the output are both checked.
            set +e
            FOUND=$(npm view "$NAME@$VERSION" version 2>view.err)
            CODE=$?
            set -e
            if [ "$CODE" -ne 0 ] && ! grep -q "E404" view.err; then
              echo "::error::npm view $NAME@$VERSION failed with a non-404 registry error"
              cat view.err
              exit 1
            fi
            rm -f view.err
            if [ -n "$FOUND" ]; then
              echo "$NAME@$VERSION already on npm, skipping"
            else
              echo "Publishing $NAME@$VERSION"
              (cd "$dir" && pnpm publish --no-git-checks --access public)
            fi
          done
