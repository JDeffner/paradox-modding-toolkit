# Manual publishing of a prepared release. Always build the requested tag.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Prepared release tag (for example v0.4.4)"
        type: string
        required: true
      prerelease:
        description: "Mark as pre-release (users must opt in; off by default)"
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach artifacts and finalize the existing release
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check tag version and collect release notes
        run: node scripts/prepare-release.mjs

      - name: Require a prepared GitHub prerelease
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,body > release.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('release.json', 'utf8'));
          const notes = readFileSync('release-body.md', 'utf8').trim();
          if (release.isDraft || !release.isPrerelease || release.body.trim() !== notes) {
            throw new Error('Run Prepare release successfully for this tag before publishing.');
          }
          NODE

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@v4
        with:
          # Must match ci.yml: jsdom declares node ^22.22.2 || ^24.15.0 || >=26,
          # and the jsdom suites fail at import on 20. This is the build/test
          # runtime only; the shipped bundles still target node18.
          node-version: 22
          cache: pnpm
          # Writes the ~/.npmrc that reads NODE_AUTH_TOKEN, for the npm
          # publish step below. Harmless for builds that never publish.
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Same gate as CI: a tag build must not ship a boundary violation.
      - name: Game boundary (no game strings outside games/ and vscode/)
        run: node scripts/check-game-boundary.mjs

      # Compile BEFORE the tests: the LSP/stdio/vic3 smoke tests fork
      # dist/server.js and silently skip when it does not exist.
      - run: pnpm run compile

      # Corpus-gated tests skip automatically (no game files in CI).
      - run: pnpm test

      # Everything in the package's dist/ ships in the vsix; stray bundles must not.
      - run: rm -f packages/vscode/dist/*.cjs

      - name: Package vsix
        working-directory: packages/vscode
        # --baseImagesUrl is not optional in a monorepo: vsce resolves relative
        # image links against the repo root, so the banner and the screenshots
        # would 404 on the listing without the packages/vscode prefix.
        run: |
          FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAG="--pre-release"; fi
          pnpm exec vsce package $FLAG --no-dependencies \
            --baseImagesUrl https://github.com/JDeffner/paradox-modding-toolkit/raw/main/packages/vscode

      - name: Build server tarball (standalone --stdio server for other editors)
        run: node scripts/build-server-tarball.mjs

      # Self-contained Windows artifact: the same payload plus the pinned,
      # checksum-verified official node.exe and px-lsp.cmd, so an embedder
      # needs no Node on the target machine. No --local-node here: a release
      # must carry the official binary.
      - name: Build Windows server zip (bundled node.exe)
        run: node scripts/build-server-zip.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: |
            packages/vscode/*.vsix
            px-lsp-server-*.tar.gz
            px-lsp-win-x64-*.zip

      - name: Attach release artifacts
        run: |
          gh release upload "$RELEASE_TAG" packages/vscode/*.vsix \
            px-lsp-server-*.tar.gz px-lsp-win-x64-*.zip --clobber

      - name: Publish to Marketplace
        id: marketplace
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --no-dependencies --packagePath *.vsix

      - name: Set final GitHub release channel
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          LATEST=true
          if [ "$PRERELEASE" = "true" ]; then LATEST=false; fi
          gh release edit "$RELEASE_TAG" --prerelease="$PRERELEASE" --latest="$LATEST"

      # Announce the release in the Discord server's #toolkit-updates, pinging
      # the @Paradox Toolkit role. DISCORD_RELEASE_WEBHOOK is a plain Discord
      # webhook URL (repo secret). The whole post is a plain message, no embed:
      # `content` caps at 2000 chars, so the notes are cut at 1600 on a line
      # boundary. Both URLs are wrapped in <> so Discord does not attach its
      # own link-preview embed to a post that is meant to be embed-free.
      # Missing secret = silent skip; a failed post warns but never fails a
      # release that already shipped.
      - name: Announce on Discord
        if: success() && steps.marketplace.outcome == 'success'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          # head -c cuts BYTES: a multibyte character split at the boundary
          # would reach jq as invalid UTF-8 and kill the post. iconv -c drops
          # the incomplete sequence (the line-boundary cut below usually
          # removes it anyway; this covers the cut landing on a newline).
          NOTES=$(head -c 1600 release-body.md | iconv -c -f UTF-8 -t UTF-8)
          if [ "$(wc -c < release-body.md)" -gt 1600 ]; then
            NOTES=$(printf '%s' "$NOTES" | sed '$d')
            NOTES="$NOTES"$'\n'"…"
          fi
          jq -n --arg tag "$RELEASE_TAG" --arg url "$URL" --arg notes "$NOTES" \
            '{content: "<@&1534329963933864079> **Paradox Toolkit \($tag)** is out.\n\n\($notes)\n\nRelease: <\($url)>\nFull changelog: <https://github.com/JDeffner/paradox-modding-toolkit/blob/main/packages/vscode/CHANGELOG.md>",
              allowed_mentions: {roles: ["1534329963933864079"]}}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK" \
            || echo "::warning::Discord release announcement failed"

      # Package versions are independent. Publish only versions missing from npm.
      # Missing NPM_TOKEN warns and skips without failing a Marketplace release.
      - name: Publish npm packages (only versions not on npm yet)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret missing, npm publish skipped"
            exit 0
          fi
          for dir in packages/protocol packages/server; do
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            # "Not published" must come from the registry saying 404, not from
            # a failed lookup: a transient registry error must stop the step,
            # not funnel into a doomed publish. `npm view` of a missing
            # version can also exit 0 with empty output on some npm majors,
            # so the exit code AND the output are both checked.
            set +e
            FOUND=$(npm view "$NAME@$VERSION" version 2>view.err)
            CODE=$?
            set -e
            if [ "$CODE" -ne 0 ] && ! grep -q "E404" view.err; then
              echo "::error::npm view $NAME@$VERSION failed with a non-404 registry error"
              cat view.err
              exit 1
            fi
            rm -f view.err
            if [ -n "$FOUND" ]; then
              echo "$NAME@$VERSION already on npm, skipping"
            else
              echo "Publishing $NAME@$VERSION"
              (cd "$dir" && pnpm publish --no-git-checks --access public)
            fi
          done
