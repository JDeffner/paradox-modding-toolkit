name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # jsdom (the webview tests) declares node ^22.22.2 || ^24.15.0 || >=26,
          # and undici reaches for worker_threads.markAsUncloneable, which does
          # not exist before 22. On 20 the jsdom suites fail at import.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: Game boundary (no game strings outside games/ and vscode/)
        run: node scripts/check-game-boundary.mjs
      # Compile BEFORE the tests: the LSP/stdio/vic3 smoke tests fork
      # dist/server.js and silently skip when it does not exist.
      - run: pnpm run compile
      - run: pnpm test
      # The browser build is the only thing that proves the language service
      # still links without node. esbuild fails outright on an unaliased node
      # builtin, so a new fs/child_process import on a reachable path breaks
      # here rather than in a consumer's bundler.
      - name: Browser language service builds
        run: pnpm run bake:browser && pnpm --filter @px-lsp/server run compile:browser
      - name: Package (vsix)
        working-directory: packages/vscode
        run: npx vsce package --allow-missing-repository --no-dependencies
      - name: Build server tarball
        run: node scripts/build-server-tarball.mjs
      # Prove the SHIPPED artifact, not just dist/: extract the tarball and run
      # the stdio smoke against it (guards the bundled-data layout — a flat
      # extraction or a missing data/<game>/ dir fails here, not at a user).
      - name: Smoke the extracted tarball
        shell: bash
        run: |
          mkdir -p /tmp/px-tarball && tar -xzf px-lsp-server-*.tar.gz -C /tmp/px-tarball
          PX_LSP_SERVER="$(echo /tmp/px-tarball/px-lsp-server-*/dist/server.js)" \
            npx vitest run packages/server/test/stdioSmoke.test.ts
      # Layout gate for the Windows zip. --local-node keeps the runner off
      # nodejs.org (a release build downloads the pinned binary instead), and
      # px-lsp.cmd is checked as text: it cannot run here.
      - name: Smoke the Windows zip layout
        shell: bash
        run: |
          node scripts/build-server-zip.mjs --local-node
          mkdir -p /tmp/px-zip && unzip -q px-lsp-win-x64-*.zip -d /tmp/px-zip
          root="$(echo /tmp/px-zip/px-lsp-win-x64-*)"
          for f in px-lsp.cmd node.exe NODE-LICENSE dist/server.js LICENSE README.md \
                   THIRD-PARTY-NOTICES.md data/ck3/freqs.json data/ck3/wikidocs/ATTRIBUTION.md; do
            test -f "$root/$f" || { echo "zip is missing $f"; exit 1; }
          done
          grep -qF '@"%~dp0node.exe" "%~dp0dist\server.js" --stdio %*' "$root/px-lsp.cmd"
