name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: Game boundary (no game strings outside games/ and vscode/)
        run: node scripts/check-game-boundary.mjs
      # Compile BEFORE the tests: the LSP/stdio/vic3 smoke tests fork
      # dist/server.js and silently skip when it does not exist.
      - run: pnpm run compile
      - run: pnpm test
      - name: Package (vsix)
        working-directory: packages/vscode
        run: npx vsce package --allow-missing-repository --no-dependencies
      - name: Build server tarball
        run: node scripts/build-server-tarball.mjs
      # Prove the SHIPPED artifact, not just dist/: extract the tarball and run
      # the stdio smoke against it (guards the bundled-data layout — a flat
      # extraction or a missing data/<game>/ dir fails here, not at a user).
      - name: Smoke the extracted tarball
        shell: bash
        run: |
          mkdir -p /tmp/px-tarball && tar -xzf px-lsp-server-*.tar.gz -C /tmp/px-tarball
          PX_LSP_SERVER="$(echo /tmp/px-tarball/px-lsp-server-*/dist/server.js)" \
            npx vitest run packages/server/test/stdioSmoke.test.ts
